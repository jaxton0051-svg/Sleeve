name: Checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app.py app_paths.py automator.py providers.py yt_manager.py yt_tools.py musictool.py jfile.py
